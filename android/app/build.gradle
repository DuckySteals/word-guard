plugins {
    id "com.android.application"
}

android {
    namespace "org.wordguard"
    compileSdk 35

    defaultConfig {
        applicationId "org.wordguard"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
